name: Build And Push Docker Image

on:
  push:
    branches:
      - master
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: build-and-push-docker-image
  cancel-in-progress: false

jobs:
  docker:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        env:
          OCD_ENGINE: docker
        run: ./opencode/build-image.sh --push

      - name: Build and push Pi image
        run: |
          pi_version="$(
            docker run --rm docker.io/library/node:20-bookworm-slim \
              npm view @earendil-works/pi-coding-agent version
          )"
          docker build \
            -f pi/Dockerfile \
            --build-arg PI_CODING_AGENT_VERSION="$pi_version" \
            --label org.opencontainers.image.title="lnksz/pid" \
            --label org.opencontainers.image.version="$pi_version" \
            -t "docker.io/lnksz/pid:$pi_version" \
            -t docker.io/lnksz/pid:latest \
            .
          docker push "docker.io/lnksz/pid:$pi_version"
          docker push docker.io/lnksz/pid:latest
