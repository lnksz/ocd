name: Build And Push Docker Image

on:
  push:
    branches:
      - master
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: build-and-push-docker-image
  cancel-in-progress: false

jobs:
  docker:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        env:
          OCD_ENGINE: docker
        run: ./build-image.sh opencode --push

      - name: Build and push Pi image
        env:
          PID_ENGINE: docker
        run: ./build-image.sh pi --push

  ox:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Check out repo
        uses: actions/checkout@v5
        with:
          ref: master

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build, verify and push OpenCode Sandbox image
        env:
          OX_ENGINE: docker
        run: ./build-image.sh ox --push

  cod:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repo
        uses: actions/checkout@v5
        with:
          ref: master

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Codex image
        env:
          COD_ENGINE: docker
        run: ./build-image.sh cod

      - name: Smoke-test Codex image
        run: python3 cod/tests/smoke.py docker.io/lnksz/cod:latest

      - name: Push Codex image
        run: |
          version=$(docker image inspect docker.io/lnksz/cod:latest --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')
          docker push "docker.io/lnksz/cod:$version"
          docker push docker.io/lnksz/cod:latest
