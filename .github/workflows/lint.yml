name: Lint

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  dockerfile:
    name: Dockerfile (${{ matrix.dockerfile }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dockerfile:
          - opencode/Dockerfile
          - pi/Dockerfile

    permissions:
      contents: read

    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Run hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.dockerfile }}

  shell:
    name: Shell
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck

      - name: Run shellcheck
        run: >-
          shellcheck build-image.sh opencode/entrypoint.sh
          opencode/update-tools.sh pi/entrypoint.sh
